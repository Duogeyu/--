name: check-domains
on:
  push:
    paths: ["domains.txt", "scripts/check_domains.py", ".github/workflows/check-domains.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_domains.py domains.txt results.md
      - run: cat results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.md
          git commit -m "Update domain check results [skip ci]" || exit 0
          git push
